name: ZeroShield CI & Qodo Code Quality Review

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  issue_comment:
    types: [ created ]

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  build-and-test:
    name: Build & Mechanical 4-Tier Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Strict TypeScript Compilation
        run: npm run build

      - name: Execute 4-Tier Test Gates
        run: npm test

  qodo-agentic-review:
    name: Qodo Agentic Code Quality Review
    needs: build-and-test
    if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/agentic_review'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodo PR Agentic Review Action
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY || secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REVIEWER.REQUIRE_ALL_TESTS_PASS: "true"
          PR_REVIEWER.ENABLE_SECURITY_AUDIT: "true"
          PR_CODE_SUGGESTIONS.NUM_CODE_SUGGESTIONS: 4
