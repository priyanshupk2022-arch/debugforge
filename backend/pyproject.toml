[project]
name = "sentinel-chain-backend"
version = "2.0.0"
description = "Autonomous Web Intelligence & Self-Healing Proxy for Bright Data Scraper Studio"
authors = [{ name = "Sentinel-Chain Core Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "cssselect>=1.2.0",
    "lxml>=5.2.0",
    "google-genai>=0.1.0",
    "playwright>=1.46.0",
    "python-multipart>=0.0.9",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
